name: GatherMap Forever compatibility checks

on:
  push:
    branches:
      - feat/forever-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Lua syntax and manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Lua compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua5.4
      - name: Validate Forever Lua syntax
        run: |
          luac5.4 -p GatherMapData.lua
          luac5.4 -p GatherMapMarkers.lua
          luac5.4 -p GatherMapDifficulty.lua
          luac5.4 -p GatherMapMigration.lua
          luac5.4 -p GatherMapForever.lua
          luac5.4 -p GatherMapCapture.lua
      - name: Validate Lua 5.1 compatibility
        run: |
          luac5.1 -p GatherMapData.lua
          luac5.1 -p GatherMapMarkers.lua
          luac5.1 -p GatherMapDifficulty.lua
          luac5.1 -p GatherMapMigration.lua
          luac5.1 -p GatherMapForever.lua
          luac5.1 -p GatherMapCapture.lua
          lua5.1 tests/test_forever_migration.lua
          lua5.1 tests/test_forever_markers.lua
          lua5.1 tests/test_forever_display.lua
          lua5.1 tests/test_forever_difficulty.lua
          lua5.1 tests/test_forever_capture.lua
      - name: Test grouping and map canvas behavior with mocked APIs
        run: |
          lua5.4 tests/test_forever_migration.lua
          lua5.4 tests/test_forever_markers.lua
          lua5.4 tests/test_forever_display.lua
      - name: Test skill and difficulty behavior with mocked Forever APIs
        run: lua5.4 tests/test_forever_difficulty.lua
      - name: Test recording events with mocked Forever APIs
        run: lua5.4 tests/test_forever_capture.lua
      - name: Test Forever saved-data migration and physical backups (PowerShell)
        shell: pwsh
        run: ./tests/test_upgrade.ps1
      - name: Verify manifests, pin template and preserved assets
        run: python3 -m unittest discover -s tests -p 'test_forever_*.py'
